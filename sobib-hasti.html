(function(){DOLLS.forEach((src,i)=>{const b=document.createElement('button');b.className='chip';b.textContent='Nukk '+(i+1);b.onclick=()=>{$('#dImg').src=src;[...$('#dPick').children].forEach(c=>c.setAttribute('aria-pressed',c===b))};$('#dPick').append(b)});$('#dPick').firstChild.click()})();
(function(){const v=id=>$('#'+id).value,f=id=>C[v(id)][1];
 const draw=()=>{const top=v('dTop'),dress=top==='kleit',bot=v('dBot'),ft=v('dFt'),hat=v('dHat');$('#dBot').disabled=$('#dBotC').disabled=dress;
  const skin='#F2C9A0';let s=`<rect x="78" y="186" width="18" height="112" fill="${skin}" ${S}/><rect x="104" y="186" width="18" height="112" fill="${skin}" ${S}/>`;
  if(!dress)s+=bot==='püksid'?`<path d="M72 188H128V292H104V214H96V292H72Z" fill="${f('dBotC')}" ${S}/>`:`<path d="M72 188H128L142 244H58Z" fill="${f('dBotC')}" ${S}/>`;
  s+=ft==='kingad'?`<ellipse cx="84" cy="302" rx="17" ry="9" fill="${f('dFtC')}" ${S}/><ellipse cx="116" cy="302" rx="17" ry="9" fill="${f('dFtC')}" ${S}/>`:`<rect x="72" y="262" width="26" height="48" rx="7" fill="${f('dFtC')}" ${S}/><rect x="102" y="262" width="26" height="48" rx="7" fill="${f('dFtC')}" ${S}/>`;
  const long=top!=='T-särk'&&!dress;s+=`<path d="M56 128L44 176M144 128L156 176" fill="none" stroke="var(--ink)" stroke-width="17" stroke-linecap="round"/><path d="M56 128L44 176M144 128L156 176" fill="none" stroke="${skin}" stroke-width="12" stroke-linecap="round"/>`;
  const tc=f('dTopC');s+=dress?`<path d="M68 98H132L152 130L138 140L130 128L152 250H48L70 128L62 140L48 130Z" fill="${tc}" ${S}/>`:long?`<path d="M68 98H132L164 166L149 174L130 136V196H70V136L51 174L36 166Z" fill="${tc}" ${S}/>`:`<path d="M68 98H132L152 130L138 140L130 128V196H70V128L62 140L48 130Z" fill="${tc}" ${S}/>`;
  if(top==='jope')s+=`<path d="M100 98V196" fill="none" ${S}/>`;if(top==='särk')s+=`<path d="M100 104V196M86 98L100 110L114 98" fill="none" ${S}/>`;if(top==='kampsun')s+=`<path d="M70 184H130" fill="none" ${S}/>`;
  s+=`<circle cx="100" cy="60" r="32" fill="${skin}" ${S}/><circle cx="89" cy="58" r="3" fill="var(--ink)"/><circle cx="111" cy="58" r="3" fill="var(--ink)"/><path d="M88 72Q100 82 112 72" fill="none" ${S}/>`;
  if(hat==='kübar')s+=`<ellipse cx="100" cy="36" rx="50" ry="9" fill="${f('dHatC')}" ${S}/><path d="M74 36Q74 6 100 6Q126 6 126 36Z" fill="${f('dHatC')}" ${S}/>`;
  else if(hat==='müts')s+=`<path d="M68 44Q68 12 100 12Q132 12 132 44Z" fill="${f('dHatC')}" ${S}/><circle cx="100" cy="10" r="7" fill="${f('dHatC')}" ${S}/>`;
  else s+=`<path d="M70 48Q72 26 100 26Q128 26 130 48Q112 34 100 38Q88 34 70 48Z" fill="#5A3A22" ${S}/>`;
  const n=(v('dName').trim()||'Nukk'),e=document.createElement('span');
  const L2=[`See on ${n}. Ta on ${v('dAge')||9}-aastane.`,`${n} ${v('dSit')}.`,`Tal on seljas ${v('dTopC')} ${top}.`];
  if(!dress)L2.push(bot==='püksid'?`Tal on jalas ${C[v('dBotC')][0]} püksid.`:`Tal on seljas ${v('dBotC')} seelik.`);
  L2.push(`Tal on jalas ${C[v('dFtC')][0]} ${ft}.`);if(hat!=='–')L2.push(`Tal on peas ${v('dHatC')} ${hat}.`);L2.push('Kas sobib?');
  $('#dTxt').textContent='';L2.forEach(t=>{const d=document.createElement('div');d.textContent=t;$('#dTxt').append(d)})};
 ['dName','dAge','dSit','dTop','dTopC','dBot','dBotC','dFt','dFtC','dHat','dHatC'].forEach(id=>$('#'+id).addEventListener('input',draw));draw()})();

/* L6 test */
mount('tund6',`<div class="box"><h3>Sõnavarakontroll</h3><p class="muted" id="tN"></p><div class="pic" id="tP"></div>
 <form id="tF" style="display:flex;gap:8px;flex-wrap:wrap;align-items:end"><label style="flex:1 1 180px">Kirjuta sõna<input type="text" id="tI" autocomplete="off" autocapitalize="off" spellcheck="false"></label><button class="big" type="submit">Kontrolli</button></form>
 <div class="say" id="tFb" aria-live="polite"></div></div>`);
(function(){let q,i,sc;const start=()=>{q=shuffle(CORE);i=0;sc=0;draw()};
 const draw=()=>{if(i>=q.length){$('#tP').innerHTML='';$('#tN').textContent='';$('#tFb').innerHTML=`Tulemus: ${sc} / 9. <button class="chip" id="tA">Veel kord</button>`;$('#tA').onclick=()=>{$('#tFb').textContent='';start()};return}
  $('#tN').textContent=`Pilt ${i+1} / 9`;$('#tP').innerHTML=gi(q[i].id);$('#tI').value=''};
 $('#tF').addEventListener('submit',e=>{e.preventDefault();if(i>=q.length)return;const a=$('#tI').value.trim().toLowerCase(),x=q[i],ok=a===x.w.toLowerCase();if(ok)sc++;
  $('#tFb').innerHTML=`<span class="${ok?'ok':'no'}">${ok?'Õige!':'Õige sõna on:'} ${x.w}</span>`;i++;draw()});start()})();
